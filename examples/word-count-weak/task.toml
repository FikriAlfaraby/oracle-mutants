# Demo task for oracle-mutants: the verifier below is deliberately weak.
schema_version = "1.0"

artifacts = ["/app/counts.json"]

[task]
name = "oracle-mutants/word-count-weak"
version = "0.1.0"
description = "Count word frequencies. Ships with a verifier that only checks the shape of the answer."

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
