[project]
name = "oracle-mutants"
version = "0.1.0"
description = "Find benchmark verifiers that accept wrong answers: mutate a task's reference outputs and re-run its verifier."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fikri Alfaraby", email = "fikrialfaraby04@gmail.com" }]
dependencies = []

[project.scripts]
oracle-mutants = "oracle_mutants.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_mutants"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]
